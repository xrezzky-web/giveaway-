<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
body{
 margin:0;
 background:radial-gradient(circle,#1f6f6f,#020b0b);
 font-family:Arial,Helvetica,sans-serif;
 color:#fff;
 display:flex;
 justify-content:center;
}
.box{

 margin:30px auto;
 background:#071414;
 border-radius:18px;

 display:flex;
 flex-direction:column;
 align-items:center;
}
h2{
 text-align:center;
 color:#00ffd5;
 margin:5px 0;
 cursor:pointer;
}
input,button,select,textarea{
 width:100%;
 margin-top:10px;
 padding:10px;
 border-radius:8px;
 border:none;
 box-sizing:border-box;
 font-size:14px;
}
button{
 background:#00ffd5;
 font-weight:bold;
 cursor:pointer;
}
#redeemBtn{
 width:100px;
 font-size:14px;
 padding:10px;
 border-radius:8px;
 margin-left:10px;
}
#wheelBox{
 position:relative;
 width:280px;
 height:280px;
 margin:20px auto;
}
#wheel{
 width:100%;
 height:100%;
 border-radius:50%;
 border:8px solid #00ffd5;
 transition: transform 4s cubic-bezier(.25,.1,.25,1);
}
#arrow{
 position:absolute;
 bottom:-28px;
 left:50%;
 transform:translateX(-50%);
 font-size:24px;
 color:#fff;

}
#result{

}
.log{

 padding:10px;

 overflow:auto;

 margin-top:20px;

}
#globalWinners, #infoBoard{
 background:#020b0b;
 padding:10px;
 overflow:auto;
 font-size:12px;
 margin-top:10px;
 width:100%;
 border-radius:8px;
 border:1px solid #00ffd5;
 max-height:120px;
}
#exportStatus{
 margin-top:6px;
 font-size:12px;
 color:#00ffd5;
 text-align:center;
}
#winnersStatus{
 margin-top:6px;
 font-size:13px;
 color:#ffcc00;
 text-align:center;
}
small{
 color:#aaa;
 margin-top:8px;
 display:block;
 text-align:center;
}
#claimBtn{
 background:#25D366;
 color:#000;
 margin-top:10px;
 display:none;
 width:100%;
}
#adminPanel{
 display:none;
 background:#020b0b;
 padding:10px;
 border-radius:10px;
 margin-top:15px;
 border:1px solid #00ffd5;
 width:100%;
}
#adminPanel button, #adminPanel textarea, #adminPanel input{
 margin-top:5px;
}
.code-wrapper{
 display:flex;
 width:100%;
 align-items:center;
}
.code-wrapper input{
 flex:1;
}

/* Additional small styles for admin manager UI */
#wheelManager{ margin-top:10px; border-top:1px solid #00ffd5; padding-top:10px; }
.wheel-item{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
.wheel-item input{ padding:6px; font-size:13px; }
.wheel-item .label-input{ flex:1; }
.wheel-item select{ width:100px; }

#eventControls{ display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }

/* Export modal */
#exportModal{
 display:none;
 position:fixed;
 left:0;
 top:0;
 width:100%;
 height:100%;
 background:rgba(0,0,0,0.6);
 z-index:9999;
 align-items:center;
 justify-content:center;
}
#exportContent{
 width:320px;
 background:#071414;
 border:1px solid #00ffd5;
 padding:12px;
 border-radius:10px;
 color:#fff;
}
#exportContent textarea{
 height:180px;
 background:#000;
 color:#fff;
 padding:8px;
 font-size:13px;
 border-radius:6px;
}
#exportButtons{ display:flex; gap:8px; margin-top:8px; }
#exportButtons button{ flex:1; }

/* admin small grid */
.admin-row{ display:flex; gap:6px; }
.admin-row > *{ flex:1; }
.mode-flag{ display:flex; align-items:center; gap:6px; margin-top:6px; color:#00ffd5; font-weight:bold; }
.mode-flag input{ width:auto; }
</style>
</head>

 <div style="margin-top:10px;border-top:1px solid #00ffd5;padding-top:10px;">
   <b>🎡 Wheel Manager</b>

 </div>

 <div style="margin-top:10px;border-top:1px solid #00ffd5;padding-top:10px;">

   <div style="display:flex;gap:6px;margin-top:6px;">

     <button id="openPublicBtn">🌐 Buka Halaman Publik</button>
     <button id="copyPublicBtn">📋 Salin Link</button>

 </div>

 <div style="margin-top:10px;border-top:1px solid #00ffd5;padding-top:10px;">
   <b>📤 Export</b>

   <div id="exportStatus"></div>
 </div>

 <div style="margin-top:10px;">
   <button id="resetBtn">❌ Hapus Semua (User & Pemenang)</button>
 </div>

</div>
</div>

<!-- EXPORT MODAL -->
<div id="exportModal">
 <div id="exportContent">
   <div style="font-weight:bold;margin-bottom:6px">EXPORT PEMENANG</div>
   <textarea id="exportArea" readonly></textarea>
   <div id="exportButtons">
     <button id="copyExportBtn">Copy Semua</button>
     <button id="closeExportBtn">Tutup</button>

 </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ================= CONFIG =================
const ADMIN_PIN="XREZZKY STORE0930";
const ADMIN_WA="6288293064112";
let MAX_SPIN_PER_USER = 0;
let MAX_WIN_PER_DEVICE = 2;
let MAX_WINNER_GLOBAL = 10;
const DEFAULT_FREE_SPIN_NEW_USER = 5;
let REQUIRE_PARAMS = false; // mode: required/wajib or testing
let EVENT_ON = false;

// prizes array will be kept in sync with firebase wheelItems (each item: {label, win, weight})
const prizes = [
 {label:"ZONK",win:false, weight:1},
 {label:"CLASS(1)",win:true, weight:1},
 {label:"ZONK",win:false, weight:1},
 {label:"TRAIN(1)",win:true, weight:1},
 {label:"ZONK",win:false, weight:1},
 {label:"TRAIN(1)+CLASS(1)",win:true, weight:1}
];

let CODES = {};
let WIN_CHANCE = 0.1; // compatibility, weighted selection used

// ================= FIREBASE =================
const firebaseConfig = {
 apiKey: "AIzaSyD85JE0QCaey1o4AUQtp24aGqNmx3AtbmA",
 authDomain: "xrezzkystore-rng.firebaseapp.com",
 databaseURL: "https://xrezzkystore-rng-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId: "xrezzkystore-rng",
 storageBucket: "xrezzkystore-rng.appspot.com",
 messagingSenderId: "304889774590",
 appId: "1:304889774590:web:5d52c2485ca2137ad480af",
 measurementId: "G-MQ71QRYHV7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================= STORAGE & DEVICE =================
const deviceId = localStorage.getItem("devId") || (()=>{ const id = "dev-"+Math.random().toString(36).slice(2); localStorage.setItem("devId", id); return id; })();
let spinData = JSON.parse(localStorage.getItem("spinData")||"{}");
let usedCodes = JSON.parse(localStorage.getItem("usedCodes")||"{}");
let lockedName = localStorage.getItem("lockedName");
let hasWon = localStorage.getItem("hasWon")==="true";
let totalSpin = JSON.parse(localStorage.getItem("totalSpin")||"0");
let lastPrize = null;
let lastResetAllTs = Number(localStorage.getItem("lastResetAllTs") || 0);

// ensure entry
if(!spinData[deviceId]) spinData[deviceId] = 0;

// ================= SETTINGS SYNC =================
const settingsRef = db.ref("settings");
settingsRef.on("value", snap => {
  const s = snap.val() || {};

  // Event ON/OFF
  if(typeof s.eventOn !== "undefined") EVENT_ON = s.eventOn === true;
  document.getElementById("eventStatus").innerText = EVENT_ON ? "ON" : "OFF";
  document.getElementById("toggleEventBtn").innerText = EVENT_ON ? "TURN OFF" : "TURN ON";

  // Mode required/testing
  REQUIRE_PARAMS = !!s.requireParams;
  if(REQUIRE_PARAMS){
    document.getElementById("modeRequired").checked = true;
    document.getElementById("modeTesting").checked = false;
  } else {
    document.getElementById("modeTesting").checked = true;
    document.getElementById("modeRequired").checked = false;
  }

  // Max fields
  if(typeof s.maxWinnerGlobal !== "undefined"){
    MAX_WINNER_GLOBAL = parseInt(s.maxWinnerGlobal) || 0;
    document.getElementById("maxWinnerGlobal").value = MAX_WINNER_GLOBAL;
  }
  if(typeof s.maxWinPerDevice !== "undefined"){
    MAX_WIN_PER_DEVICE = parseInt(s.maxWinPerDevice) || 0;
    document.getElementById("maxWinDevice").value = MAX_WIN_PER_DEVICE;
  }
  if(typeof s.maxSpinPerUser !== "undefined"){
    MAX_SPIN_PER_USER = parseInt(s.maxSpinPerUser) || 0;
    document.getElementById("maxSpinDevice").value = MAX_SPIN_PER_USER;
  }

  // freeSpin setting
  if(typeof s.freeSpinNewUser !== "undefined"){
    document.getElementById("freeSpinNewUser").value = String(s.freeSpinNewUser);
  } else {
    document.getElementById("freeSpinNewUser").value = "";
  }

  // public URL
  if(typeof s.publicUrl !== "undefined"){
    document.getElementById("publicUrl").value = s.publicUrl || "";
  } else {
    document.getElementById("publicUrl").value = "";
  }

  // resetAllTimestamp handling - when admin triggered reset all data, clients should zero local spin and hasWon
  if(typeof s.resetAllTimestamp !== "undefined"){
    const t = Number(s.resetAllTimestamp) || 0;
    if(t > lastResetAllTs){
      spinData[deviceId] = 0;
      hasWon = false;
      localStorage.setItem("hasWon","false");
      localStorage.setItem("spinData",JSON.stringify(spinData));
      localStorage.setItem("lastResetAllTs",String(t));
      lastResetAllTs = t;
      updateInfo();
    }
  }
});

// ================= CODES SYNC =================
db.ref("codes").on("value", snapshot=>{
  CODES = snapshot.val() || {};
});

// ================= WHEEL ITEMS SYNC =================
const wheelItemsRef = db.ref("wheelItems");
wheelItemsRef.once("value").then(snap=>{
  if(!snap.exists()){
    const initial = prizes.map(p => ({ label: p.label, win: !!p.win, weight: Number(p.weight) || 1 }));
    db.ref("wheelItems").set(initial);
  }
});
wheelItemsRef.on("value", snap=>{
  const items = snap.val();
  if(!items || !Array.isArray(items) || items.length===0){
    const initial = prizes.map(p => ({ label: p.label, win: !!p.win, weight: Number(p.weight) || 1 }));
    db.ref("wheelItems").set(initial);
    return;
  }
  prizes.length = 0;
  for(let i=0;i<items.length;i++){
    const it = items[i] || {};
    prizes.push({ label: it.label || "ZONK", win: !!it.win, weight: (typeof it.weight !== "undefined") ? Number(it.weight) : 1 });
  }
  // enforce at least 1 win and 1 lose
  const hasWin = prizes.some(p=>p.win);
  const hasLose = prizes.some(p=>!p.win);
  if(!hasWin || !hasLose){
    if(!hasLose) prizes[0].win = false;
    if(!hasWin){
      if(prizes.length < 2) prizes.push({label:"CLASS(1)", win:true, weight:1});
      else prizes[1].win = true;
    }
    const corrected = prizes.map(p => ({ label: p.label, win: p.win, weight: Number(p.weight)||1 }));
    db.ref("wheelItems").set(corrected);
    return;
  }
  drawWheel();
  renderWheelListUI(items);
});

// ================= DRAW WHEEL (with dynamic text sizing) =================
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const c = 140;
function drawWheel(){
  const slice = 2*Math.PI / prizes.length;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<prizes.length;i++){
    ctx.beginPath();
    ctx.moveTo(c,c);
    ctx.fillStyle = `hsl(${Math.random()*360},80%,55%)`;
    ctx.arc(c,c,140,i*slice,(i+1)*slice);
    ctx.fill();
    ctx.save();
    ctx.translate(c,c);
    ctx.rotate(i*slice + slice/2);
    ctx.fillStyle="#000";

    const text = prizes[i].label || "";
    const baseFontSize = 12;
    const minFontSize = 8;
    const textRadius = 50;
    const availableArcLen = slice * textRadius;
    const maxTextWidth = Math.max(40, Math.min(120, availableArcLen * 0.9));

    let fontSize = baseFontSize;
    ctx.font = `bold ${fontSize}px Arial`;
    while(ctx.measureText(text).width > maxTextWidth && fontSize > minFontSize){
      fontSize--;
      ctx.font = `bold ${fontSize}px Arial`;
    }

    ctx.fillText(text,50,5);
    ctx.restore();
  }
}
drawWheel();

// ================= UTIL =================
function updateInfo(){
  document.getElementById("spinInfo").innerText =
    (spinData[deviceId]||0) > 0 ? `🎟 Spin tersisa: ${spinData[deviceId]}` : `⚠️ Spin habis!`;
}
function saveData(){
  localStorage.setItem("spinData", JSON.stringify(spinData));
  localStorage.setItem("usedCodes", JSON.stringify(usedCodes));
  localStorage.setItem("hasWon", hasWon ? "true" : "false");
  localStorage.setItem("lockedName", lockedName || "");
  localStorage.setItem("totalSpin", totalSpin);
}

// Weighted random helper
function weightedPickIndex(indices){
  if(!Array.isArray(indices) || indices.length===0) return null;
  let total=0;
  const weights = indices.map(i=>{
    const w = Number(prizes[i].weight) || 0;
    const ww = (w<0) ? 0 : w;
    total += ww;
    return ww;
  });
  if(total <= 0) return indices[Math.floor(Math.random()*indices.length)];
  let r = Math.random()*total;
  for(let k=0;k<indices.length;k++){
    r -= weights[k];
    if(r <= 0) return indices[k];
  }
  return indices[indices.length-1];
}

// ================= SPIN (core) =================
let rot = 0, lock = false;
document.getElementById("spinBtn").addEventListener("click", ()=>{
  if(lock) return;
  if((spinData[deviceId]||0) <= 0) return alert("Spin kamu habis!");
  const name = document.getElementById("name").value.trim();
  if(!name) return alert("Isi nama!");
  if(!lockedName){ lockedName = name; document.getElementById("name").disabled = true; }
  totalSpin++;

  spinData[deviceId] = (spinData[deviceId]||0) - 1;
  saveData();
  updateInfo();

  db.ref("winners").once("value").then(snapshot=>{
    const winnersData = snapshot.val() || [];
    db.ref("deviceWins/"+deviceId).once("value").then(dwSnap=>{
      const deviceWinsCount = dwSnap.val() || 0;

      const winPrizes = prizes.map((p,i)=>p.win?i:null).filter(i=>i!==null);
      const losePrizes = prizes.map((p,i)=>!p.win?i:null).filter(i=>i!==null);

      let forceZonk = false;
      if(!EVENT_ON) forceZonk = true;
      if(MAX_WINNER_GLOBAL>0 && winnersData.length >= MAX_WINNER_GLOBAL) forceZonk = true;
      if(MAX_WIN_PER_DEVICE>0 && deviceWinsCount >= MAX_WIN_PER_DEVICE) forceZonk = true;

      let idx;
      if(forceZonk || hasWon){
        idx = weightedPickIndex(losePrizes) || 0;
      } else {
        const allIndices = prizes.map((_,i)=>i);
        idx = weightedPickIndex(allIndices);
        if(idx === null) idx = Math.floor(Math.random()*prizes.length);
        if(prizes[idx].win && ((MAX_WINNER_GLOBAL>0 && winnersData.length >= MAX_WINNER_GLOBAL) || (MAX_WIN_PER_DEVICE>0 && deviceWinsCount >= MAX_WIN_PER_DEVICE) || !EVENT_ON)){
          idx = weightedPickIndex(losePrizes) || idx;
        }
      }

      const anglePer = 360 / prizes.length;
      const target = 90 - (idx * anglePer) - anglePer/2;
      rot += 360*6 + (target - (rot%360));
      lock = true;
      canvas.style.transform = `rotate(${rot}deg)`;

      setTimeout(()=>{
        lock = false;
        lastPrize = prizes[idx];
        document.getElementById("result").innerText = `🎉 ${lockedName} mendapatkan ${lastPrize.label}`;
        document.getElementById("log").innerHTML += `<div>${lockedName} → ${lastPrize.label}</div>`;

        // record winner if allowed and real win
        if(lastPrize.win && !hasWon && EVENT_ON){
          db.ref("winners").once("value").then(snap2=>{
            const current = snap2.val()||[];
            const globalOk = (MAX_WINNER_GLOBAL===0) || (current.length < MAX_WINNER_GLOBAL);
            if(globalOk){
              db.ref("deviceWins/"+deviceId).once("value").then(dwSnap2=>{
                const currentDeviceWins = dwSnap2.val() || 0;
                const deviceOk = (MAX_WIN_PER_DEVICE===0) || (currentDeviceWins < MAX_WIN_PER_DEVICE);
                if(deviceOk){
                  hasWon = true;
                  const timeStamp = new Date().toLocaleString();
                  current.push({ name: lockedName, prize: lastPrize.label, time: timeStamp });
                  db.ref("winners").set(current);
                  db.ref("deviceWins/"+deviceId).set(currentDeviceWins+1);
                  document.getElementById("claimBtn").style.display = "block";
                  const t = encodeURIComponent(`Halo admin XREZZKYSTORE 👋\n\nSaya ${lockedName} menang:\n🎁 ${lastPrize.label}\n🕒 ${timeStamp}`);
                  window.open(`https://wa.me/${ADMIN_WA}?text=${t}`, "_blank");
                }
              });
            }
          });
        }

        if(!lastPrize.win || !hasWon) document.getElementById("claimBtn").style.display = "none";

        saveData();
        updateInfo();
      }, 4200);
    });
  });
});

// ================= REDEEM CODE =================
document.getElementById("redeemBtn").addEventListener("click", ()=>{
  const codeInput = document.getElementById("code");
  const code = codeInput.value.trim().toUpperCase();
  if(!code) return alert("Masukkan kode!");
  if(CODES[code]){
    const key = deviceId + "_" + code;
    if(!usedCodes[key]){
      spinData[deviceId] = (spinData[deviceId]||0) + CODES[code];
      usedCodes[key] = true;
      saveData();
      updateInfo();
      codeInput.value = "";
      alert(`✅ Code ${code} berhasil! Spin +${CODES[code]}`);
    } else alert("⚠️ Kode sudah digunakan!");
  } else alert("⚠️ Kode tidak valid!");
});

// ================= CLAIM =================
document.getElementById("claimBtn").addEventListener("click", ()=>{
  if(!lastPrize || !lastPrize.win) return;
  const t = encodeURIComponent(`Halo admin XREZZKYSTORE 👋\n\nSaya ${lockedName} menang:\n🎁 ${lastPrize.label}`);
  window.open(`https://wa.me/${ADMIN_WA}?text=${t}`, "_blank");
});

// ================= ADMIN OPEN =================
let tap = 0;
(function setupAdminAccess(){
  // if page loaded with public=1, disable admin open
  try {
    const params = new URLSearchParams(window.location.search);
    if(params.get('public') === '1' || params.get('public') === 'true'){
      // hide admin unlocking (do nothing on title clicks)
      document.getElementById('title').addEventListener('click', ()=>{});
      return;
    }
  } catch(e){}
  // normal admin unlock by 5 taps
  document.getElementById("title").addEventListener("click", ()=>{
    tap++;
    if(tap >= 5){
      const pin = prompt("PIN ADMIN:");
      if(pin === ADMIN_PIN) document.getElementById("adminPanel").style.display = "block";
      tap = 0;
    }
  });
})();

// ================= ADMIN ACTIONS =================

// Apply settings (writes to Firebase)
document.getElementById("applySettingsBtn").addEventListener("click", ()=>{
  const mwg = parseInt(document.getElementById("maxWinnerGlobal").value) || 0;
  const mwd = parseInt(document.getElementById("maxWinDevice").value) || 0;
  const msp = parseInt(document.getElementById("maxSpinDevice").value) || 0;
  const freeNewRaw = document.getElementById("freeSpinNewUser").value.trim();
  const freeNew = freeNewRaw === "" ? null : (parseInt(freeNewRaw) || 0);

  db.ref("settings/maxWinnerGlobal").set(mwg);
  db.ref("settings/maxWinPerDevice").set(mwd);
  db.ref("settings/maxSpinPerUser").set(msp);
  if(freeNew !== null) db.ref("settings/freeSpinNewUser").set(freeNew);
  alert("Settings disimpan ke Firebase.");
});

});
document.getElementById("modeTesting").addEventListener("change", ()=>{

// toggle event ON/OFF with validation and start-from-zero prompt
document.getElementById("toggleEventBtn").addEventListener("click", async ()=>{
  const newState = !EVENT_ON;
  if(newState){ // enabling event
    // check if REQUIRE_PARAMS and required fields set
    const sSnap = await settingsRef.once("value");
    const s = sSnap.val() || {};
    const require = !!s.requireParams;
    if(require){
      const info = (document.getElementById("adminInfo").value || "").trim() || s.infoBoard;
      const mwg = parseInt(document.getElementById("maxWinnerGlobal").value) || s.maxWinnerGlobal;
      const mwd = parseInt(document.getElementById("maxWinDevice").value) || s.maxWinPerDevice;
      const msp = parseInt(document.getElementById("maxSpinDevice").value) || s.maxSpinPerUser;
      if(!info || !mwg || !mwd || !msp){
        return alert("Mode Wajib: lengkapi semua parameter (Info Event, Max Pemenang Global, Max Hadiah Per Device, Max Spin Per Device) sebelum mengaktifkan event.");
      }
    }
    // Ask whether start fresh or continue
    const startFresh = confirm("Aktifkan event: Mulai dari nol? (OK = Mulai dari nol — akan mereset pemenang & hitungan hadiah per device) \nBatal = Lanjutkan event lama");
    if(startFresh){
      await performResetAllData(false); // reset timestamp, winners, deviceWins; keep codes
    }
    db.ref("settings/eventOn").set(true);
    alert("Event diaktifkan.");
  } else {
    db.ref("settings/eventOn").set(false);
    alert("Event dimatikan. Pengguna masih dapat spin tapi hasil akan ZONK.");
  }
});

// RESET SEMUA DATA (admin) - keeps codes, clears winners and device wins and signals clients to clear local spins
document.getElementById("resetAllDataBtn").addEventListener("click", ()=>{
  if(!confirm("⚠️ Data user, spin, dan pemenang akan terhapus semua. Lanjutkan?")) return;
  performResetAllData(true).then(()=> alert("Reset semua data selesai."));
});

// Implementation of reset all data (sets winners=[], deviceWins={}, and settings.resetAllTimestamp)
async function performResetAllData(setTimestamp){
  // reset winners and deviceWins in Firebase
  await db.ref("winners").set([]);
  await db.ref("deviceWins").set({});
  // optionally update resetAllTimestamp to notify clients to clear their local spin counts
  const ts = Date.now();
  if(setTimestamp) await db.ref("settings/resetAllTimestamp").set(ts);
  // update local client as well
  spinData = spinData || {};
  spinData[deviceId] = 0;
  hasWon = false;
  localStorage.setItem("spinData", JSON.stringify(spinData));
  localStorage.setItem("hasWon","false");
  localStorage.setItem("lastResetAllTs", String(ts));
}

// ================= WHEEL MANAGER UI =================
function renderWheelListUI(items){
  const container = document.getElementById("wheelList");
  container.innerHTML = "";
  items.forEach((it, idx) => {
    const div = document.createElement("div");
    div.className = "wheel-item";

    const input = document.createElement("input");
    input.className = "label-input";
    input.value = it.label || "";
    input.placeholder = "Nama hadiah";
    input.addEventListener("change", ()=>{
      wheelItemsRef.once("value").then(snap=>{
        let arr = snap.val() || [];
        if(!Array.isArray(arr)) arr = [];
        arr[idx] = arr[idx] || {};
        arr[idx].label = input.value || "ZONK";
        db.ref("wheelItems").set(arr);
      });
    });

    const sel = document.createElement("select");
    const optWin = document.createElement("option"); optWin.value="win"; optWin.text="HADIAH";
    const optLose = document.createElement("option"); optLose.value="lose"; optLose.text="ZONK";
    sel.appendChild(optWin); sel.appendChild(optLose);
    sel.value = (it.win ? "win" : "lose");
    sel.addEventListener("change", ()=>{
      wheelItemsRef.once("value").then(snap=>{
        let arr = snap.val() || [];
        if(!Array.isArray(arr)) arr = [];
        arr[idx] = arr[idx] || {};
        arr[idx].win = (sel.value === "win");
        const newArr = arr.map(a => ({ label: a.label||"ZONK", win: !!a.win, weight: Number(a.weight)||1 }));
        const hasWin2 = newArr.some(a=>a.win);
        const hasLose2 = newArr.some(a=>!a.win);
        if(!hasWin2 || !hasLose2){
          alert("Wheel harus memiliki minimal 1 ZONK dan 1 HADIAH. Perubahan dibatalkan.");
          sel.value = (it.win ? "win" : "lose");
          return;
        }
        db.ref("wheelItems").set(newArr);
      });
    });

    const weightInput = document.createElement("input");
    weightInput.className = "weight-input";
    weightInput.type = "number";
    weightInput.min = "0";
    weightInput.value = (typeof it.weight !== "undefined") ? String(Number(it.weight) || 1) : "1";
    weightInput.title = "Weight (0 = tidak pernah dipilih)";
    weightInput.addEventListener("change", ()=>{
      let w = parseInt(weightInput.value);
      if(isNaN(w) || w < 0) w = 0;
      wheelItemsRef.once("value").then(snap=>{
        let arr = snap.val() || [];
        if(!Array.isArray(arr)) arr = [];
        arr[idx] = arr[idx] || {};
        arr[idx].weight = w;
        db.ref("wheelItems").set(arr);
      });
    });

    const delBtn = document.createElement("button");
    delBtn.innerText = "Hapus";
    delBtn.addEventListener("click", ()=>{
      if(!confirm("Hapus item wheel ini?")) return;
      wheelItemsRef.once("value").then(snap=>{
        let arr = snap.val() || [];
        if(!Array.isArray(arr)) arr = [];
        if(arr.length <= 1){
          alert("Tidak bisa menghapus. Wheel harus memiliki minimal 1 item.");
          return;
        }
        const newArr = arr.slice(0, idx).concat(arr.slice(idx+1));
        const hasWin3 = newArr.some(a=>a && a.win);
        const hasLose3 = newArr.some(a=>a && !a.win);
        if(!hasWin3 || !hasLose3){
          alert("Tidak bisa menghapus item ini karena akan menghilangkan semua ZONK atau semua HADIAH.");
          return;
        }
        db.ref("wheelItems").set(newArr);
      });
    });

    div.appendChild(input);
    div.appendChild(sel);
    div.appendChild(weightInput);
    div.appendChild(delBtn);
    container.appendChild(div);
  });
  if(items.length === 0) container.innerHTML = "<i>Tidak ada item wheel</i>";
}
document.getElementById("addWheelItemBtn").addEventListener("click", ()=>{
  const label = (document.getElementById("newWheelLabel").value || "").trim();
  const type = document.getElementById("newWheelType").value;
  let weight = parseInt(document.getElementById("newWheelWeight").value);
  if(isNaN(weight) || weight < 0) weight = 1;
  if(!label) return alert("Masukkan nama hadiah");
  const isWin = (type === "win");
  wheelItemsRef.once("value").then(snap=>{
    let arr = snap.val() || [];
    if(!Array.isArray(arr)) arr = [];
    arr.push({ label: label, win: isWin, weight: weight });
    db.ref("wheelItems").set(arr);
    document.getElementById("newWheelLabel").value = "";
    document.getElementById("newWheelWeight").value = "1";
  });
});

const winnersRef = db.ref("winners");
winnersRef.on("value", snapshot=>{
  const winners = snapshot.val() || [];
  if(winners.length === 0){
    document.getElementById("globalWinners").innerHTML = "<b>Pemenang:</b><br>Belum ada pemenang";
  } else {
    let html = "<b>Pemenang:</b><br>";
    winners.forEach((w,i) => {
      html += `${i+1}. ${w.name} - ${w.prize} (${w.time})<br>`;
    });
    document.getElementById("globalWinners").innerHTML = html;
  }

  if(MAX_WINNER_GLOBAL>0 && winners.length >= MAX_WINNER_GLOBAL){
    document.getElementById("winnersStatus").innerText = "⚠️ Pemenang telah tercapai. Event tidak menerima pemenang baru, peserta masih dapat spin namun hasil akan ZONK.";
  } else {
    document.getElementById("winnersStatus").innerText = "";
  }

  document.getElementById("exportStatus").innerText = `Jumlah pemenang sekarang: ${winners.length}`;
});

// ================= FREE SPIN NEW USER ALLOCATION =================
// When user first visits, they should receive the configured free spin (settings.freeSpinNewUser) or default
(function allocateFreeSpinIfNeeded(){
  if(localStorage.getItem("claimedFree")) return;
  // read once settings then assign
  settingsRef.once("value").then(snap=>{
    const s = snap.val() || {};
    const freeVal = (typeof s.freeSpinNewUser !== "undefined") ? (parseInt(s.freeSpinNewUser) || DEFAULT_FREE_SPIN_NEW_USER) : DEFAULT_FREE_SPIN_NEW_USER;
    spinData[deviceId] = (spinData[deviceId]||0) + freeVal;
    localStorage.setItem("claimedFree","yes");
    saveData();
    updateInfo();
  });
})();

updateInfo();
